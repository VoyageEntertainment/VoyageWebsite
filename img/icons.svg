<svg xmlns="http://www.w3.org/2000/svg" class="sprite" aria-hidden="true" focusable="false">
  <!--
    Voyage icon set. Source of truth: img/icons.svg.
    After editing, run `node tools/sync-icons.mjs` to copy it into every page.

    Thin rounded lines in the text colour, plus one small solid block in
    the accent blue. The block is the game; the line is what happens to it.

      logo  the mark, a sailing boat, 32 x 32
      i-*   interface glyphs, 24 x 24
      p-*   pictograms, 48 x 48, always carrying the block

    Elements with class "blk" are filled with the accent; "ink" is a solid
    shape in the text colour.
  -->

  <!-- ===== brand ===== -->
  <symbol id="logo" viewBox="0 0 32 32">
    <path class="ink" d="M17 3v17h11z"/>
    <path class="blk" d="M14 9v11H6z"/>
    <path class="ink" d="M3 23h26l-3.2 5.1a2 2 0 0 1-1.7.9H7.9a2 2 0 0 1-1.7-.9z"/>
  </symbol>

  <!-- ===== interface, 24 x 24 ===== -->
  <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-arrow-up-right" viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"/></symbol>
  <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 8h16M4 16h16"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4l9 16H3zM12 10v4M12 17h.01"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h.01"/></symbol>
  <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M4 7.5l8 5.5 8-5.5"/></symbol>
  <symbol id="i-sort" viewBox="0 0 24 24"><path d="M4 7h16M4 12h11M4 17h6"/></symbol>

  <!-- ===== pictograms, 48 x 48 ===== -->
  <!-- retention: the curve drops, then holds; the block is who stayed -->
  <symbol id="p-retention" viewBox="0 0 48 48"><path d="M7 7v34h34M12 12c1 10 6 17 16 17h4"/><rect class="blk" x="33" y="25" width="8" height="8" rx="1.5"/></symbol>
  <!-- cadence: a calendar with the update day marked -->
  <symbol id="p-cadence" viewBox="0 0 48 48"><rect x="8" y="11" width="32" height="29" rx="4"/><path d="M8 19h32M16 7v8M32 7v8M16 27h.01M22 27h.01M16 34h.01M24 34h.01M32 34h.01"/><rect class="blk" x="28" y="23" width="8" height="8" rx="1.5"/></symbol>
  <!-- monetisation: a price tag -->
  <symbol id="p-tag" viewBox="0 0 48 48"><path d="M10 8h15l16 16-17 17L8 25V10a2 2 0 0 1 2-2zM15 15h.01"/><rect class="blk" x="21" y="21" width="8" height="8" rx="1.5"/></symbol>
  <!-- community: a message being typed -->
  <symbol id="p-community" viewBox="0 0 48 48"><path d="M11 9h26a4 4 0 0 1 4 4v16a4 4 0 0 1-4 4H21l-8 7v-7h-2a4 4 0 0 1-4-4V13a4 4 0 0 1 4-4z"/><path class="ink" d="M14 19h4v4h-4zM22 19h4v4h-4z"/><rect class="blk" x="30" y="19" width="4" height="4"/></symbol>
  <!-- send: an envelope sealed with the game -->
  <symbol id="p-send" viewBox="0 0 48 48"><rect x="6" y="11" width="36" height="26" rx="4"/><path d="M7.5 14l12.5 9M40.5 14 28 23"/><rect class="blk" x="20" y="20" width="8" height="8" rx="1.5"/></symbol>
  <!-- review: the game under a lens -->
  <symbol id="p-review" viewBox="0 0 48 48"><circle cx="21" cy="21" r="13"/><path d="M31 31l10 10"/><rect class="blk" x="17" y="17" width="8" height="8" rx="1.5"/></symbol>
  <!-- offer: one game, two ways to be paid -->
  <symbol id="p-offer" viewBox="0 0 48 48"><path d="M18 24h7l6-10h9M25 24l6 10h9M36 10l4 4-4 4M36 30l4 4-4 4"/><rect class="blk" x="7" y="19" width="10" height="10" rx="2"/></symbol>
  <!-- handover: the game under our flag -->
  <symbol id="p-handover" viewBox="0 0 48 48"><path d="M17 26V6M18 7l18 6-18 6"/><rect class="blk" x="9" y="27" width="16" height="16" rx="2.5"/></symbol>
  <!-- privacy: nothing tracks you -->
  <symbol id="p-shield" viewBox="0 0 48 48"><path d="M24 5l15 6v12c0 9-6 15.5-15 20-9-4.5-15-11-15-20V11z"/><rect class="blk" x="20" y="18" width="8" height="8" rx="1.5"/></symbol>
  <!-- privacy: what stays in the browser -->
  <symbol id="p-browser" viewBox="0 0 48 48"><rect x="6" y="9" width="36" height="30" rx="4"/><path d="M6 17h36M11 13h.01M15 13h.01M25 25h11M25 31h7"/><rect class="blk" x="12" y="23" width="8" height="8" rx="1.5"/></symbol>
  <!-- privacy: the services the page talks to -->
  <symbol id="p-network" viewBox="0 0 48 48"><rect x="7" y="7" width="6" height="6" rx="1.5"/><rect x="35" y="7" width="6" height="6" rx="1.5"/><rect x="21" y="37" width="6" height="6" rx="1.5"/><path d="M19 19l-6-6M29 19l6-6M24 29v8"/><rect class="blk" x="20" y="20" width="8" height="8" rx="1.5"/></symbol>
</svg>
